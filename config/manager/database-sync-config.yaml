apiVersion: v1
kind: ConfigMap
metadata:
  name: database-sync-config
  namespace: system
data:
  # Database connection
  # Note: DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD are provided by
  # the partnerlabs-datastore-pguser-labrat secret in partnerlabs-wg-cluster
  # Database name (update this to match your actual database name)
  DB_NAME: "openshift_partner_labs_app_staging"
  DB_SSL_MODE: "require"  # require for PostgreSQL connections with SSL enforcement

  # Connection pool settings
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"

  # Sync configuration
  SYNC_NAMESPACE: "default"
  SYNC_POLLING_INTERVAL: "30s"
  SYNC_BATCH_SIZE: "100"

  # Cluster defaults
  BASE_DOMAIN: "openshiftpartnerlabs.com"
