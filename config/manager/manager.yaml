apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: opl-cluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: opl-cluster-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: opl-cluster-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: opl-cluster-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: quay.io/yoza/opl-cluster-operator:v0.2.3
        name: manager
        env:
          # Git configuration
          - name: GIT_REPO_URL
            value: "git@github.com:yashoza19/opl-argocd.git"
          - name: GIT_BRANCH
            value: "master"
          - name: GIT_SSH_KEY_PATH
            value: "/etc/git-secret/id_rsa"
          - name: GIT_LOCAL_PATH
            value: "/tmp/opl-argocd"
          - name: GIT_AUTHOR_NAME
            value: "OPL Cluster Operator"
          - name: GIT_AUTHOR_EMAIL
            value: "cluster-operator@openshiftpartnerlabs.com"
          # Database configuration (optional - comment out to disable database sync)
          # References existing PostgreSQL secret: partnerlabs-datastore-pguser-labrat
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: partnerlabs-datastore-pguser-labrat
                key: host
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: partnerlabs-datastore-pguser-labrat
                key: port
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: DB_NAME
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: partnerlabs-datastore-pguser-labrat
                key: user
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: partnerlabs-datastore-pguser-labrat
                key: password
          - name: DB_SSL_MODE
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: DB_SSL_MODE
          - name: DB_MAX_CONNS
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: DB_MAX_CONNS
          - name: DB_MIN_CONNS
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: DB_MIN_CONNS
          - name: SYNC_NAMESPACE
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: SYNC_NAMESPACE
          - name: SYNC_POLLING_INTERVAL
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: SYNC_POLLING_INTERVAL
          - name: SYNC_BATCH_SIZE
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: SYNC_BATCH_SIZE
          - name: BASE_DOMAIN
            valueFrom:
              configMapKeyRef:
                name: database-sync-config
                key: BASE_DOMAIN
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          - name: git-ssh-key
            mountPath: /etc/git-secret
            readOnly: true
      volumes:
        - name: git-ssh-key
          secret:
            secretName: git-ssh-key
            defaultMode: 0644
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
