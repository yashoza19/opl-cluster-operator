# This rule is not used by the project opl-cluster-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the opl.openshiftpartnerlabs.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opl-cluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterrequest-editor-role
rules:
- apiGroups:
  - opl.openshiftpartnerlabs.com
  resources:
  - clusterrequests
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - opl.openshiftpartnerlabs.com
  resources:
  - clusterrequests/status
  verbs:
  - get
